openapi: 3.0.3
info:
  title: EventFlow API
  version: 0.1.0
  description: 'Phase 1 API contract for EventFlow (The Computing Effect). SDLC Step 3. Status: for review, 24 Nov 2026.


    Rules: REST + JSON over HTTPS · base path `/api/v1` · every response is `{success, data}` or `{success:false, error}` · money is a string
    with 2 decimals · company always comes from the sign-in token · lists are paged (`page`, `size`) · app-made UUIDs make saves offline-safe
    · one call per screen, one call per user action.


    Rule from the SDLC: a new or changed API is added here first, reviewed, then coded.'
servers:
- url: https://api.eventflow.in/api/v1
  description: Production (domain to be decided)
- url: https://staging-api.eventflow.in/api/v1
  description: Staging
- url: http://localhost:8080/api/v1
  description: Local
security:
- bearerAuth: []
tags:
- name: Auth
  description: Sign in, tokens, PIN
- name: Home
  description: Dashboard
- name: Clients
  description: The event company's customers
- name: Events
  description: Events, items needed, reminders
- name: Calendar
  description: Month view
- name: Payments
  description: Money received
- name: Expenses
  description: Money spent
- name: Sync
  description: Offline upload
- name: Crew
  description: Crew, wages, crew payments
- name: Quotations
  description: Quotes, versions, approve, share
- name: Public
  description: Client-facing quote page (no sign-in)
- name: Money
  description: Accounts, stats, export
- name: Notifications
  description: Bell and push
- name: Settings
  description: Profile, lists, history
- name: Ops
  description: Monitoring
paths:
  /auth/login:
    post:
      tags:
      - Auth
      summary: Sign in with mobile + PIN
      operationId: postAuthLogin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/LoginResponse'
                required:
                - success
                - data
        '400': &id001
          $ref: '#/components/responses/BadRequest'
      security: []
      description: 'Wrong PIN → 400 `INCORRECT_PIN` with `fields.attemptsLeft`. 5 wrong → 400 `ACCOUNT_LOCKED` with `lockedUntil`. A new sign-in
        deactivates the previous device (one device at a time). Rate limited per mobile and per IP.


        **PRD:** US-01'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /auth/refresh:
    post:
      tags:
      - Auth
      summary: Get a new access token
      operationId: postAuthRefresh
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/TokenPair'
                required:
                - success
                - data
        '400': *id001
      security: []
      description: Fails with `SIGNED_IN_ELSEWHERE` if another device signed in later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Sign out this device
      operationId: postAuthLogout
      responses:
        '204':
          description: Done, no body.
  /auth/change-pin:
    post:
      tags:
      - Auth
      summary: Change PIN (first login and Settings)
      operationId: postAuthChangePin
      responses:
        '204':
          description: Done, no body.
        '400': *id001
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
      description: '**PRD:** US-02, US-25'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePinRequest'
  /me:
    get:
      tags:
      - Auth
      summary: Current owner, company and enabled features
      operationId: getMe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Me'
                required:
                - success
                - data
        '401': *id002
  /dashboard/home:
    get:
      tags:
      - Home
      summary: Everything the Home screen needs in one call
      operationId: getDashboardHome
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/DashboardHome'
                required:
                - success
                - data
        '401': *id002
      description: '**PRD:** US-03'
      parameters:
      - name: month
        in: query
        required: false
        schema:
          type: string
          example: 2026-11
        description: 'Default: current month.'
  /clients:
    get:
      tags:
      - Clients
      summary: Search clients
      operationId: getClients
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Client'
                  page:
                    $ref: '#/components/schemas/PageMeta'
                required:
                - success
                - data
        '401': *id002
      parameters:
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Name or mobile.
      - &id004
        name: page
        in: query
        required: false
        schema:
          type: integer
          default: 0
      - &id005
        name: size
        in: query
        required: false
        schema:
          type: integer
          default: 20
          maximum: 100
    post:
      tags:
      - Clients
      summary: Create client
      operationId: postClients
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Client'
                required:
                - success
                - data
        '400': *id001
        '401': *id002
        '409': &id009
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientInput'
  /clients/lookup:
    get:
      tags:
      - Clients
      summary: Find a client by mobile (name suggestion)
      operationId: getClientsLookup
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Client'
                required:
                - success
                - data
        '401': *id002
        '404': &id003
          $ref: '#/components/responses/NotFound'
      description: '**PRD:** US-04'
      parameters:
      - name: mobile
        in: query
        required: true
        schema:
          type: string
  /clients/{id}:
    patch:
      tags:
      - Clients
      summary: Update client
      operationId: patchClientsId
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Client'
                required:
                - success
                - data
        '400': *id001
        '401': *id002
        '403': &id007
          $ref: '#/components/responses/Forbidden'
        '404': *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientInput'
      parameters:
      - &id008
        name: id
        in: path
        required: true
        schema: &id011
          type: string
          format: uuid
  /events:
    get:
      tags:
      - Events
      summary: Event list for a tab
      operationId: getEvents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventSummary'
                  page:
                    $ref: '#/components/schemas/PageMeta'
                required:
                - success
                - data
        '401': *id002
      description: 'Tab counts come from `GET /events/counts` (cached), so the list stays light.


        **PRD:** US-05


        **Feature flag:** `EVENTS`'
      parameters:
      - name: tab
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/EventStatus'
      - name: date
        in: query
        required: false
        schema: &id010
          type: string
          format: date
        description: Only events on this day.
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Client name or phone.
      - *id004
      - *id005
    post:
      tags:
      - Events
      summary: Add event
      operationId: postEvents
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/EventDetail'
                required:
                - success
                - data
        '400': *id001
        '401': *id002
      description: '**PRD:** US-04'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
  /events/counts:
    get:
      tags:
      - Events
      summary: Counts per tab
      operationId: getEventsCounts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      UPCOMING: &id006
                        type: integer
                      PENDING: *id006
                      COMPLETED: *id006
                      CANCELLED: *id006
                required:
                - success
                - data
        '401': *id002
  /events/{id}:
    get:
      tags:
      - Events
      summary: Event detail with totals, payments, expenses, crew and items
      operationId: getEventsId
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/EventDetail'
                required:
                - success
                - data
        '400': *id001
        '401': *id002
        '403': *id007
        '404': *id003
      description: '**PRD:** US-06'
      parameters:
      - *id008
    patch:
      tags:
      - Events
      summary: Edit event
      operationId: patchEventsId
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/EventDetail'
                required:
                - success
                - data
        '400': *id001
        '401': *id002
        '404': *id003
        '409': *id009
      description: Send `version`; a stale version returns 409 `STALE_VERSION`. Moving the date to the future moves Pending → Upcoming (E-05).
        Lowering agreed below received is allowed with a warning flag (E-02).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
      parameters:
      - *id008
    delete:
      tags:
      - Events
      summary: Delete event (only without money entries)
      operationId: deleteEventsId
      responses:
        '204':
          description: Done, no body.
        '401': *id002
        '404': *id003
        '409': *id009
      description: 409 `HAS_MONEY_ENTRIES` → cancel instead (E-21).
      parameters:
      - *id008
  /events/{id}/complete:
    post:
      tags:
      - Events
      summary: Mark completed
      operationId: postEventsIdComplete
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/EventSummary'
                required:
                - success
                - data
        '401': *id002
        '404': *id003
        '409': *id009
      parameters:
      - *id008
  /events/{id}/cancel:
    post:
      tags:
      - Events
      summary: Cancel event, optional refund
      operationId: postEventsIdCancel
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/EventDetail'
                required:
                - success
                - data
        '400': *id001
        '401': *id002
        '403': *id007
        '404': *id003
      description: 'Refund 0 to received, stored as a negative payment. Unpaid crew removed; paid wages stay.


        **PRD:** US-08'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
      parameters:
      - *id008
  /events/{id}/reminder:
    get:
      tags:
      - Events
      summary: Ready WhatsApp reminder for the balance
      operationId: getEventsIdReminder
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ReminderMessage'
                required:
                - success
                - data
        '400': *id001
        '401': *id002
        '403': *id007
        '404': *id003
      description: 'Owner sends it in WhatsApp; EventFlow never sends on its own. 409 `NO_BALANCE` when balance is 0 (E-20).


        **PRD:** US-11a'
      parameters:
      - *id008
  /events/{id}/items:
    post:
      tags:
      - Events
      summary: Add item needed
      operationId: postEventsIdItems
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/EventItem'
                required:
                - success
                - data
        '400': *id001
        '401': *id002
        '403': *id007
        '404': *id003
      description: 'LENT items create a ''Lent item'' expense on the event.


        **PRD:** US-08a'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventItemInput'
      parameters:
      - *id008
  /event-items/{id}:
    patch:
      tags:
      - Events
      summary: Edit item needed (tick, qty, rent)
      operationId: patchEventItemsId
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/EventItem'
                required:
                - success
                - data
        '400': *id001
        '401': *id002
        '403': *id007
        '404': *id003
      description: Changing rent updates its expense (E-18).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventItemInput'
      parameters:
      - *id008
    delete:
      tags:
      - Events
      summary: Remove item needed
      operationId: deleteEventItemsId
      responses:
        '204':
          description: Done, no body.
        '401': *id002
        '404': *id003
      parameters:
      - *id008
  /event-items/{id}/returned:
    post:
      tags:
      - Events
      summary: Mark lent item returned
      operationId: postEventItemsIdReturned
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/EventItem'
                required:
                - success
                - data
        '401': *id002
        '404': *id003
      parameters:
      - *id008
  /calendar:
    get:
      tags:
      - Calendar
      summary: 'Month view: days with events and the events'
      operationId: getCalendar
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/CalendarMonth'
                required:
                - success
                - data
        '401': *id002
      description: '**PRD:** US-09'
      parameters:
      - name: month
        in: query
        required: true
        schema:
          type: string
          example: 2026-11
  /payments:
    post:
      tags:
      - Payments
      summary: Record payment (offline-safe)
      operationId: postPayments
      responses:
        '201':
          description: Created (or the existing one if this id was already saved)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Payment'
                required:
                - success
                - data
        '400': *id001
        '401': *id002
        '403': *id007
        '404': *id003
      description: 'Amount above balance without `confirmOverpayment` → 400 `OVERPAYMENT_NOT_CONFIRMED`. Future date → 400 `FUTURE_DATE` (E-04).


        **PRD:** US-10


        **Feature flag:** `PAYMENTS`'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentInput'
  /payments/{id}:
    patch:
      tags:
      - Payments
      summary: Edit payment
      operationId: patchPaymentsId
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Payment'
                required:
                - success
                - data
        '400': *id001
        '401': *id002
        '403': *id007
        '404': *id003
      description: 'Writes old → new to change history.


        **PRD:** US-11'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentInput'
      parameters:
      - *id008
    delete:
      tags:
      - Payments
      summary: Delete payment (soft delete)
      operationId: deletePaymentsId
      responses:
        '204':
          description: Done, no body.
        '401': *id002
        '404': *id003
      description: '**PRD:** US-11'
      parameters:
      - *id008
  /expenses:
    get:
      tags:
      - Expenses
      summary: List expenses
      operationId: getExpenses
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Expense'
                  page:
                    $ref: '#/components/schemas/PageMeta'
                required:
                - success
                - data
        '401': *id002
      description: '**Feature flag:** `EXPENSES`'
      parameters:
      - name: from
        in: query
        required: false
        schema: *id010
      - name: to
        in: query
        required: false
        schema: *id010
      - name: eventId
        in: query
        required: false
        schema: *id011
      - name: categoryId
        in: query
        required: false
        schema: *id011
      - *id004
      - *id005
    post:
      tags:
      - Expenses
      summary: Add expense (offline-safe)
      operationId: postExpenses
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Expense'
                required:
                - success
                - data
        '400': *id001
        '401': *id002
        '403': *id007
        '404': *id003
      description: '**PRD:** US-12'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseInput'
  /expenses/{id}:
    patch:
      tags:
      - Expenses
      summary: Edit expense
      operationId: patchExpensesId
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Expense'
                required:
                - success
                - data
        '400': *id001
        '401': *id002
        '404': *id003
        '409': *id009
      description: 'Auto expenses (SALARY, LENT_ITEM) can only change through their source: 409 `AUTO_EXPENSE`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseInput'
      parameters:
      - *id008
    delete:
      tags:
      - Expenses
      summary: Delete expense (soft delete)
      operationId: deleteExpensesId
      responses:
        '204':
          description: Done, no body.
        '401': *id002
        '404': *id003
        '409': *id009
      parameters:
      - *id008
  /sync:
    post:
      tags:
      - Sync
      summary: Upload entries saved offline, in one batch
      operationId: postSync
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/SyncResult'
                required:
                - success
                - data
        '400': *id001
        '401': *id002
      description: 'Each entry is processed on its own (one bad entry does not block others). Same id twice → `ALREADY_SAVED` (E-16). Failed entries
        raise a ''couldn''t sync'' notification.


        **PRD:** US-10, E-15–E-17'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
  /crew:
    get:
      tags:
      - Crew
      summary: Crew list with owed/paid and wages chart
      operationId: getCrew
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/CrewList'
                required:
                - success
                - data
        '401': *id002
      description: '**PRD:** US-13, US-15


        **Feature flag:** `CREW`'
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - DUE
          - ADVANCE
          - SETTLED
    post:
      tags:
      - Crew
      summary: Add crew member
      operationId: postCrew
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/CrewMember'
                required:
                - success
                - data
        '400': *id001
        '401': *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrewMemberInput'
  /crew/{id}:
    get:
      tags:
      - Crew
      summary: 'Crew details: events, payments, advances, balance'
      operationId: getCrewId
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
