components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from /auth/login. Carries user, company and device; the server never trusts a company id from the request.
  schemas:
    Money:
      type: string
      pattern: ^-?\d{1,12}\.\d{2}$
      example: '15000.00'
      description: Exact rupee amount as text, 2 decimals. Never a float.
    ApiError:
      type: object
      properties:
        code:
          type: string
          example: BALANCE_EXCEEDED
        message:
          type: string
          example: Amount is more than the balance due.
        fields:
          type: object
          additionalProperties:
            type: string
          description: Field-level errors for forms.
      required:
      - code
      - message
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          $ref: '#/components/schemas/ApiError'
      required:
      - success
      - error
    PageMeta:
      type: object
      properties:
        page: *id006
        size: *id006
        totalItems: *id006
        totalPages: *id006
    Feature:
      type: string
      enum:
      - EVENTS
      - PAYMENTS
      - EXPENSES
      - CREW
      - QUOTATIONS
      - MONEY_STATS
      - NOTIFICATIONS
      - SETTINGS
    PaymentMode:
      type: string
      enum:
      - UPI
      - CASH
    LoginRequest:
      type: object
      properties:
        mobile:
          type: string
          pattern: ^\+91\d{10}$
          example: '+919876543210'
        pin:
          type: string
          pattern: ^\d{4}$
          example: '4821'
        keepSignedIn: *id012
        device:
          type: object
          properties:
            platform:
              type: string
              enum:
              - WEB
              - ANDROID
              - IOS
            label:
              type: string
              example: Chrome on Android
      required:
      - mobile
      - pin
      - device
    TokenPair:
      type: object
      properties:
        accessToken:
          type: string
          description: Short-lived (15 min) JWT.
        refreshToken:
          type: string
          description: Long-lived, one active device.
        expiresIn: *id006
    LoginResponse:
      type: object
      properties:
        tokens:
          $ref: '#/components/schemas/TokenPair'
        mustChangePin: *id012
        me:
          $ref: '#/components/schemas/Me'
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
      required:
      - refreshToken
    ChangePinRequest:
      type: object
      properties:
        currentPin:
          type: string
          pattern: ^\d{4}$
        newPin:
          type: string
          pattern: ^\d{4}$
          description: Not equal to old; not 0000, 1234 or four same digits.
      required:
      - currentPin
      - newPin
    Me:
      type: object
      properties:
        userId: *id011
        name:
          type: string
        mobile:
          type: string
        role:
          type: string
          enum:
          - OWNER
        company:
          type: object
          properties:
            id: *id011
            name:
              type: string
              example: Sri Balaji Events
        features:
          type: array
          items:
            $ref: '#/components/schemas/Feature'
    MonthPoint:
      type: object
      properties:
        month:
          type: string
          example: 2026-11
        received: &id014
          $ref: '#/components/schemas/Money'
        expenses: *id014
        profit: *id014
    DashboardHome:
      type: object
      properties:
        month:
          type: string
          example: 2026-11
        profit:
          type: object
          properties:
            profitSoFar: *id014
            expectedProfit: *id014
            changeVsLastMonthPct:
              type: number
              nullable: true
              example: 12.5
        received:
          type: object
          properties:
            amount: *id014
            billed: *id014
            percentOfBilled:
              type: number
            paymentCount:
              type: integer
              example: 3
              description: 'PROPOSED for Home — awaiting backend approval. Number of payments received this month (\"3 payments\").'
        toCollect:
          type: object
          properties:
            amount: *id014
            collected:
              allOf:
              - $ref: '#/components/schemas/Money'
              description: 'PROPOSED for Home — awaiting backend approval. Total received so far on the events that make up To collect (BR-14b).'
            billed:
              allOf:
              - $ref: '#/components/schemas/Money'
              description: 'PROPOSED for Home — awaiting backend approval. Total agreed amount of the events that make up To collect (BR-14b).'
            clientCount:
              type: integer
              example: 3
              description: 'PROPOSED for Home — awaiting backend approval. Number of clients with a balance due.'
            byClient:
              type: array
              items:
                $ref: '#/components/schemas/BalanceDueRow'
        expenses:
          type: object
          properties:
            amount: *id014
            count:
              type: integer
              example: 2
              description: 'PROPOSED for Home — awaiting backend approval. Number of expenses this month.'
            recent:
              type: array
              items:
                $ref: '#/components/schemas/Expense'
        events:
          type: object
          properties:
            thisMonth: *id006
            done: *id006
            upcomingCount:
              type: integer
              example: 4
              description: 'PROPOSED for Home — awaiting backend approval. Total number of upcoming events (the list may be shorter).'
            upcoming:
              type: array
              items:
                $ref: '#/components/schemas/EventSummary'
        chart:
          type: array
          items:
            $ref: '#/components/schemas/MonthPoint'
        unreadNotifications: *id006
    Client:
      type: object
      properties:
        id: *id011
        name:
          type: string
          example: Meera Nair
        mobile:
          type: string
          example: '+919840012345'
        notes:
          type: string
    ClientInput:
      type: object
      properties:
        name:
          type: string
        mobile:
          type: string
          pattern: ^\+91\d{10}$
        notes:
          type: string
      required:
      - name
      - mobile
    EventStatus:
      type: string
      enum:
      - UPCOMING
      - PENDING
      - COMPLETED
      - CANCELLED
    PaymentStatus:
      type: string
      enum:
      - UNPAID
      - PARTIAL
      - PAID
      - OVERPAID
    Location:
      type: object
      properties:
        venueName:
          type: string
          example: Green Park Hall
        mapsUrl:
          type: string
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
    EventTotals:
      type: object
      properties:
        agreed: *id014
        quoted:
          $ref: '#/components/schemas/Money'
          nullable: true
        received: *id014
        balance: *id014
        percentCollected:
          type: number
          nullable: true
        expenses: *id014
        profitSoFar: *id014
        expectedProfit: *id014
        paymentStatus:
          $ref: '#/components/schemas/PaymentStatus'
    EventSummary:
      type: object
      properties:
        id: *id011
        client:
          $ref: '#/components/schemas/Client'
        eventType:
          type: string
          example: Wedding Reception
        startDate: *id010
        endDate:
          type: string
          format: date
          nullable: true
        startTime:
          type: string
          example: '19:00'
        venueName:
          type: string
        status:
          $ref: '#/components/schemas/EventStatus'
        totals:
          $ref: '#/components/schemas/EventTotals'
    EventDetail:
      allOf:
      - $ref: '#/components/schemas/EventSummary'
      - type: object
        properties:
          location:
            $ref: '#/components/schemas/Location'
          notes:
            type: string
          quotationId:
            type: string
            format: uuid
            nullable: true
          payments:
            type: array
            items:
              $ref: '#/components/schemas/Payment'
          expenses:
            type: array
            items:
              $ref: '#/components/schemas/Expense'
          crew:
            type: array
            items:
              $ref: '#/components/schemas/EventCrew'
          items:
            type: array
            items:
              $ref: '#/components/schemas/EventItem'
          cancelReason:
            type: string
            nullable: true
          version: *id006
    EventInput:
      type: object
      properties:
        client:
          type: object
          properties:
            id:
              type: string
              format: uuid
              nullable: true
            name:
              type: string
            mobile:
              type: string
          description: Existing client id, or name + mobile to find or create.
        eventTypeId: *id011
        startDate: *id010
        endDate:
          type: string
          format: date
          nullable: true
        startTime:
          type: string
          nullable: true
        endTime:
          type: string
          nullable: true
        location:
          $ref: '#/components/schemas/Location'
        agreedAmount:
          $ref: '#/components/schemas/Money'
          nullable: true
        advance:
          type: object
          properties:
            id: *id011
            amount: *id014
            mode:
              $ref: '#/components/schemas/PaymentMode'
            paidOn: *id010
          description: Optional. Creates a payment (US-04).
        notes:
          type: string
        version:
          type: integer
          description: Required on PATCH (optimistic lock).
      required:
      - client
      - eventTypeId
      - startDate
    CancelRequest:
      type: object
      properties:
        reason:
          type: string
          nullable: true
        refund:
          type: object
          properties:
            id: *id011
            amount: *id014
            mode:
              $ref: '#/components/schemas/PaymentMode'
            paidOn: *id010
          description: 0 to received. Omit for no refund.
    EventItem:
      type: object
      properties:
        id: *id011
        itemId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          example: Par light
        quantity: *id006
        ownership:
          type: string
          enum:
          - OWNED
          - LENT
        supplierName:
          type: string
          nullable: true
        rentAmount:
          $ref: '#/components/schemas/Money'
          nullable: true
        isReady: *id012
        returnedAt:
          type: string
          format: date-time
          nullable: true
    EventItemInput:
      type: object
      properties:
        id: *id011
        itemId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        quantity: *id006
        ownership:
          type: string
          enum:
          - OWNED
          - LENT
        supplierName:
          type: string
        rentAmount: *id014
        isReady: *id012
      required:
      - name
      - quantity
      - ownership
    ReminderMessage:
      type: object
      properties:
        phone:
          type: string
        text:
          type: string
          example: 'Hi Divya, a gentle reminder: ₹45,000 is pending for your Wedding on Sat, 28 Nov 2026. Thank you! — Sri Balaji Events'
        whatsappUrl:
          type: string
          example: https://wa.me/919840012345?text=...
    CalendarMonth:
      type: object
      properties:
        month:
          type: string
          example: 2026-11
        days:
          type: array
          items:
            type: object
            properties:
              date: *id010
              eventCount: *id006
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventSummary'
    PaymentInput:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Created by the app. Same id twice = saved once.
        eventId: *id011
        amount: *id014
        mode:
          $ref: '#/components/schemas/PaymentMode'
        paidOn: *id010
        reference:
          type: string
        note:
          type: string
        confirmOverpayment:
          type: boolean
          description: Must be true when amount > balance (BR-16).
      required:
      - id
      - eventId
      - amount
      - mode
      - paidOn
    Payment:
      type: object
      properties:
        id: *id011
        eventId: *id011
        amount: *id014
        kind:
          type: string
          enum:
          - PAYMENT
