  responses:
    BadRequest:
      description: Invalid input or a business rule refused it
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: VALIDATION_FAILED
              message: Date cannot be in the future.
    Unauthorized:
      description: Not signed in, token expired, or signed in on another device
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: SIGNED_IN_ELSEWHERE
              message: You signed in on another device.
    Forbidden:
      description: Not allowed, or the feature is off for this company
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: FEATURE_DISABLED
              message: Crew is not enabled for your plan.
    NotFound:
      description: Not found (or belongs to another company)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: Event not found.
